<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{pageTitle}}</title>
    <meta name="description" content="{{description}}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,560;9..144,650&display=swap" rel="stylesheet">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles/style.css">
  </head>
  <body class="{{bodyClass}}">
    <a class="skip-link" href="#content">Skip to content</a>
    <header class="site-header">
      <div class="wrap header-inner">
        <a class="logo" href="/">{{siteTitle}}</a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
          Menu
        </button>
        <nav id="site-nav" class="site-nav">
          {{nav}}
        </nav>
      </div>
    </header>

    <main id="content" class="wrap">
      {{content}}
    </main>

    <footer class="site-footer">
      <div class="wrap footer-grid">
        <section>
          <h2>Get occasional notes</h2>
          <p>Short emails when there is something worth sharing. No regular cadence, no fuss.</p>
          {{newsletterForm}}
        </section>
        <section>
          <h2>Explore</h2>
          <nav class="footer-nav">
            {{nav}}
          </nav>
          <p class="copyright">&copy; {{year}} {{siteTitle}}</p>
        </section>
      </div>
    </footer>
    <script src="/js/main.js"></script>
  </body>
</html>
